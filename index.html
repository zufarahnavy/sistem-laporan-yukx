  <meta name="description" content="YukBanyuwangi — operasional & laporan trip: data pemesanan (Google Sheets), kalkulasi budget, manifest Tim Lapang, Google Calendar, invoice, tagihan, rekap, laba rugi & report.">
  <title>YukBanyuwangi — Trip Operation &amp; Report</title>
  <link rel="icon" id="favicon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- Tema terakhir diterapkan SEBELUM CSS lain → tidak ada kedip warna/font -->
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('yb:tema') || 'null'), r = document.documentElement;
        var g = localStorage.getItem('yb:gelap');
        if (g === null ? matchMedia('(prefers-color-scheme: dark)').matches : JSON.parse(g)) r.setAttribute('data-theme', 'dark'); else r.setAttribute('data-theme', 'light');
        if (t && t.vars) {
          var gelap = r.getAttribute('data-theme') === 'dark';
          Object.keys(t.vars).forEach(function (k) { if (gelap && /--c-(bg|surface|text|text-muted|primary-tint|primary-tint-2|ink|ink-2)$/.test(k)) return; r.style.setProperty(k, t.vars[k]); });
          if (t.title) document.title = t.title;
          if (t.fav) document.getElementById('favicon').href = t.fav;
          (t.fonts || []).forEach(function (f) { if (f && !/^(Plus Jakarta Sans|Bricolage Grotesque)$/.test(f)) document.write('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=' + f.replace(/\s/g, '+') + ':wght@400;500;600;700;800&display=swap">'); });
        }
      } catch (e) { }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
